services:
  api:
    build: .
    env_file: .env
    environment:
      STORAGE_DIR: /data
    volumes:
      - ./storage:/data
      - models:/models          # Hugging Face cache: BGE-M3 and the reranker download once
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s

  ui:
    build: .
    command: ["streamlit", "run", "ui/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  models:
